schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi + Jetstream JS2
description: Pi coding agent using OpenAI-compatible Jetstream via sandbox secret js2
sourceURL: https://github.com/njg4ne/sbx-pi-js2-kit
sandbox:
  image: docker.io/sbx/pi-image:latest
  entrypoint:
    - pi

permissions:
  network:
    allow:
      # A credential's inject domains are not allowed implicitly; declare the
      # domain here as well as in the credentials block below.
      - llm.jetstream-cloud.org
      # pi's runtime package installs (extensions, skills, prompt templates,
      # themes) and the packages named in settings, fetched on startup.
      - registry.npmjs.org

credentials:
  - service: js2
    apiKey:
      name: JS2_API_KEY
      proxyManaged: true
      inject:
        - domain: llm.jetstream-cloud.org
          header: Authorization
          format: 'Bearer %s'
